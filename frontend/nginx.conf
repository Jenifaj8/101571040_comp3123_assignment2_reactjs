
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow multipart uploads containing images up to 2 MB
    # Extra space is provided for form data
    client_max_body_size 3M;

    # Forward API requests to the backend container
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve uploaded employee pictures
    location /uploads/ {
        proxy_pass http://backend:8081;
    }

    # Allow React Router pages to refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
